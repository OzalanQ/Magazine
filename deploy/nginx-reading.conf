# Reading for fun —— Nginx 反代配置（域名 + HTTPS）
#
# 用法：
#   1) 把下面 your.domain.com 改成你的真实域名
#   2) sudo cp deploy/nginx-reading.conf /etc/nginx/sites-available/reading-for-fun
#   3) sudo ln -s /etc/nginx/sites-available/reading-for-fun /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot --nginx -d your.domain.com   # 自动签发证书并加上 443 + 跳转
#
# certbot 跑完后会在本文件里追加 443 块与 HTTP->HTTPS 跳转，无需手动写。

server {
    listen 80;
    server_name your.domain.com;

    # 证书申请期间 certbot 需要用 80 端口验证，这里先纯反代即可
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
