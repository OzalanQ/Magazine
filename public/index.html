<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reading for fun</title>
<style>
  :root{
    --bg:#f5f6f8;--panel:#fff;--ink:#1f2430;--ink-soft:#6b7280;--line:#e7e9ef;
    --accent:#4f6ef7;--accent-soft:#eef1fe;--radius:14px;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f6ef7,#7b5cf0);display:grid;place-items:center;color:#fff;font-weight:800}
  .brand small{font-weight:500;color:var(--ink-soft);font-size:12px}
  .search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink-soft)}
  .search input{border:0;background:transparent;outline:none;flex:1;font-size:14px;color:var(--ink)}
  .spacer{flex:1}
  .layout{display:flex;min-height:calc(100vh - 60px)}
  .sidebar{width:248px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
  .side-title{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;padding:4px 8px 10px}
  .zone{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;color:#33384a;margin-bottom:2px;transition:.12s}
  .zone:hover{background:var(--bg)}
  .zone.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .zone .ic{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .zone .count{margin-left:auto;font-size:12px;color:var(--ink-soft);background:var(--bg);border-radius:20px;padding:1px 8px}
  .zone.active .count{background:#fff;color:var(--accent)}
  .divider{height:1px;background:var(--line);margin:16px 6px}
  .side-hint{font-size:12px;color:#9aa1b1;line-height:1.6;padding:6px 10px;background:var(--bg);border-radius:10px;margin-top:14px}
  .content{flex:1;padding:22px 26px 40px;min-width:0}
  .crumb{font-size:13px;color:var(--ink-soft);margin-bottom:6px}.crumb b{color:var(--ink)}
  .toolbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .toolbar h1{font-size:22px;font-weight:700}.toolbar .total{color:var(--ink-soft);font-size:14px}
  .toolbar .spacer{flex:1}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;cursor:pointer;padding:7px 12px;border-radius:8px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  select.sort{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink);cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(30,40,80,.12)}
  .cover{position:relative;aspect-ratio:3/4;background:#eef0f5;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .open{position:absolute;inset:0;background:rgba(18,22,40,.42);display:flex;align-items:center;justify-content:center;opacity:0;transition:.16s}
  .cover .open span{background:#fff;color:#1f2430;font-size:13px;font-weight:700;border-radius:9px;padding:9px 16px}
  .card:hover .cover .open{opacity:1}
  .meta{padding:11px 12px 13px}
  .meta .t{font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .s{font-size:11.5px;color:var(--ink-soft);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
  .meta .zchip{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px;margin-top:8px}
  .grid.list{grid-template-columns:1fr;gap:10px}
  .grid.list .card{display:flex;flex-direction:row}
  .grid.list .cover{width:74px;aspect-ratio:3/4;flex-shrink:0}
  .grid.list .meta{flex:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .grid.list .meta .t{font-size:15px;-webkit-line-clamp:1}
  .empty{color:var(--ink-soft);text-align:center;padding:60px 0;font-size:14px}
  .foot{margin-top:34px;font-size:12px;color:#aab;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  /* 阅读弹层 */
  .reader{position:fixed;inset:0;background:rgba(15,18,30,.92);z-index:50;display:none;flex-direction:column}
  .reader.show{display:flex}
  .reader-bar{height:54px;display:flex;align-items:center;gap:14px;padding:0 20px;color:#fff;background:rgba(0,0,0,.35)}
  .reader-bar .rt{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reader-bar a,.reader-bar button{color:#fff;border:1px solid rgba(255,255,255,.4);background:transparent;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;text-decoration:none}
  .reader-bar button:hover,.reader-bar a:hover{background:rgba(255,255,255,.12)}
  .reader iframe{flex:1;width:100%;border:0;background:#fff}
  .loading{text-align:center;color:var(--ink-soft);padding:50px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">R</div>Reading for fun</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" placeholder="搜索 PDF 文件名…" />
    </div>
    <div class="spacer"></div>
    <a class="brand" href="/admin" style="font-size:13px;color:var(--ink-soft);text-decoration:none;font-weight:500">管理后台</a>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">我的分区</div>
      <div id="zoneList"></div>
      <div class="side-hint">点击封面即可在线阅读 PDF；如需上传，请进入「管理后台」。</div>
    </aside>

    <main class="content">
      <div class="crumb">我的资料库 / <b id="crumbZone">全部文件</b></div>
      <div class="toolbar">
        <h1 id="zoneName">全部文件</h1><span class="total" id="zoneTotal">0 个文件</span>
        <div class="spacer"></div>
        <div class="seg" id="viewSeg">
          <button class="on" data-view="grid">网格</button>
          <button data-view="list">列表</button>
        </div>
        <select class="sort" id="sort">
          <option value="new">最近上传</option>
          <option value="name">文件名 A→Z</option>
        </select>
      </div>
      <div class="grid" id="grid"><div class="loading">加载中…</div></div>
      <div class="foot"><span>封面缩略图由 PDF 首页自动生成</span><span>在线阅读 · 分区浏览</span></div>
    </main>
  </div>

  <div class="reader" id="reader">
    <div class="reader-bar">
      <div class="rt" id="readerTitle"></div>
      <a id="readerDl" href="#" target="_blank">下载</a>
      <button id="readerClose">关闭</button>
    </div>
    <iframe id="readerFrame" title="PDF 阅读器"></iframe>
  </div>

<script>
  let zones = [], files = [], curZone = 'all', curView = 'grid', sort = 'new';
  const $ = (s) => document.querySelector(s);

  async function init(){
    zones = await fetch('/api/zones').then(r=>r.json());
    await loadFiles();
  }
  function renderZones(){
    const total = files.length;
    const counts = {}; zones.forEach(z=>counts[z.id]=0); files.forEach(f=>counts[f.zoneId]=(counts[f.zoneId]||0)+1);
    let html = `<div class="zone ${curZone==='all'?'active':''}" data-zone="all">📚 全部文件 <span class="count">${total}</span></div>`;
    zones.forEach(z=>{ html += `<div class="zone ${curZone===z.id?'active':''}" data-zone="${z.id}">📁 ${z.name} <span class="count">${counts[z.id]||0}</span></div>`; });
    $('#zoneList').innerHTML = html;
    document.querySelectorAll('.zone').forEach(el=>el.onclick=()=>{ curZone=el.dataset.zone; renderZones(); loadFiles(); });
  }
  async function loadFiles(){
    const z = $('#q').value.trim();
    let list = await fetch('/api/files?zone='+encodeURIComponent(curZone)).then(r=>r.json());
    if(z) list = list.filter(f=>f.title.toLowerCase().includes(z.toLowerCase()));
    if(sort==='name') list = [...list].sort((a,b)=>a.title.localeCompare(b.title,'zh'));
    else list = [...list].sort((a,b)=> (b.uploadedAt||'').localeCompare(a.uploadedAt||''));
    const zn = curZone==='all' ? '全部文件' : (zones.find(x=>x.id===curZone)||{}).name || '';
    $('#zoneName').textContent = zn; $('#crumbZone').textContent = zn;
    $('#zoneTotal').textContent = list.length + ' 个文件';
    renderZones();
    const grid = $('#grid'); grid.className = 'grid'+(curView==='list'?' list':'');
    grid.innerHTML = list.length ? list.map(f=>`
      <article class="card" data-id="${f.id}" data-title="${f.title.replace(/"/g,'')}">
        <div class="cover"><img loading="lazy" src="/thumb/${f.id}" alt="${f.title}"><div class="open"><span>📖 在线阅读</span></div></div>
        <div class="meta"><div class="t">${f.title}</div>
          <div class="s"><span>${f.pages?f.pages+' 页':''}</span><span>${fmtSize(f.size)}</span><span>${f.uploadedAt||''}</span></div>
          <span class="zchip">${f.zoneName}</span></div>
      </article>`).join('') : `<div class="empty">该分区暂无文件。</div>`;
    document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openReader(c.dataset.id,c.dataset.title));
  }
  function fmtSize(b){ if(b>1048576) return (b/1048576).toFixed(1)+' MB'; if(b>1024) return (b/1024).toFixed(0)+' KB'; return b+' B'; }
  function openReader(id,title){
    $('#readerTitle').textContent = title;
    $('#readerDl').href = '/file/'+id;
    $('#readerFrame').src = '/file/'+id+'#toolbar=1&view=FitH';
    $('#reader').classList.add('show');
    document.body.style.overflow='hidden';
  }
  $('#readerClose').onclick=()=>{ $('#reader').classList.remove('show'); $('#readerFrame').src=''; document.body.style.overflow=''; };
  $('#viewSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); curView=b.dataset.view; loadFiles(); };
  $('#sort').onchange=e=>{ sort=e.target.value; loadFiles(); };
  let t; $('#q').oninput=()=>{ clearTimeout(t); t=setTimeout(loadFiles,200); };
  init();
</script>
</body>
</html>
