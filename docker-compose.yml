# Reading for fun —— 阿里云部署配置
# 在服务器上：git clone 仓库后，cp .env.example .env 并修改 ADMIN_KEY，再 docker compose up -d
services:
  reading-for-fun:
    build: .
    image: reading-for-fun:latest
    container_name: reading-for-fun
    restart: unless-stopped        # 服务器重启/崩溃后自动拉起
    ports:
      - "127.0.0.1:3000:3000"      # 仅本机监听，由前置 Nginx 接管 80/443
    env_file:
      - .env                       # ADMIN_KEY 等密钥从 .env 读取，不进仓库
    volumes:
      - ./data:/app/data           # 分区/文件元数据，持久化到服务器磁盘
      - ./uploads:/app/uploads     # 上传的 PDF 源文件，持久化
      - ./thumbs:/app/thumbs       # 封面缩略图，持久化
